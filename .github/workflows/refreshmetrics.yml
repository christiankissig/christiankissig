name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Europe/London
          # Tuned for senior/staff roles: show scope (years, repos contributed
          # to, notable orgs), output (commits, PRs) and featured projects;
          # leave out vanity/noise rows.
          # header: name, years on GitHub, repositories contributed to
          # activity: commits, PRs opened/reviewed, issues, comments
          # Dropped: community (following/sponsoring), repositories (disk usage,
          # sponsors, packages; stars are on the featured cards), metadata, and
          # the isocalendar (its commits-per-day stats read as automated
          # commits; GitHub shows the contribution graph anyway).
          base: header,activity  # no spaces: the action mis-parses "a, b" here

          # Languages: percentages only. (The recently-used section crashes in
          # metrics 3.34 on current GitHub event payloads, so it's left out.)
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_categories: markup, programming, data
          # litmus-cas-uaf-bug holds ~14 MB of generated assembly litmus
          # output, which otherwise shows up as "72% Assembly".
          plugin_languages_skipped: litmus-cas-uaf-bug

          # Featured projects as cards.
          plugin_repositories: yes
          plugin_repositories_featured: mordor, rmm-zoo-dataset, python-lsp-client, python-isabelle-lsp-client, isabelle-check
          plugin_repositories_order: featured
          plugin_repositories_limit: 5

          # Contributions to repositories owned by others / organisations.
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
